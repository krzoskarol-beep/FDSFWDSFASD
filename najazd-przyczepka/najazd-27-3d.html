<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Najazd motocyklowy 2,7 m z 2 części – model 3D</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9edf1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d2731}
  #view{position:fixed;inset:0}
  #view canvas{display:block;touch-action:none}
  #labels{position:fixed;inset:0;pointer-events:none}
  .lbl{font-size:11.5px;background:rgba(255,255,255,.88);border:1px solid #b9c3cc;border-radius:6px;padding:2px 6px;white-space:nowrap;color:#1d2731;font-weight:600}
  #top{position:fixed;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
  #top>*{pointer-events:auto}
  .grp{display:flex;background:#fff;border:1px solid #c7d0d8;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .grp button{border:0;background:transparent;padding:7px 10px;font-size:13px;color:#1d2731;cursor:pointer;border-right:1px solid #e3e8ec}
  .grp button:last-child{border-right:0}
  .grp button.on{background:#1f6feb;color:#fff}
  .ex{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #c7d0d8;border-radius:10px;padding:4px 10px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ex input{width:110px}
  #panel{position:fixed;left:8px;bottom:8px;width:min(430px,calc(100vw - 16px));max-height:46vh;display:flex;flex-direction:column;background:#fff;border:1px solid #c7d0d8;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  #panel.min{max-height:none}
  #panel.min #pbody{display:none}
  #tabs{display:flex;border-bottom:1px solid #e3e8ec}
  #tabs button{flex:1;border:0;background:transparent;padding:9px 4px;font-size:13px;cursor:pointer;color:#55626e;font-weight:600}
  #tabs button.on{color:#1f6feb;box-shadow:inset 0 -2px 0 #1f6feb}
  #tabs #mini{flex:0 0 38px;font-size:16px}
  #pbody{overflow:auto;padding:10px 12px 12px;font-size:13.5px;line-height:1.45}
  #pbody h3{margin:0 0 4px;font-size:15px}
  #pbody ul{margin:4px 0 8px;padding-left:18px}
  #pbody li{margin:2px 0}
  .muted{color:#66737f}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  td,th{border-bottom:1px solid #edf0f3;padding:4px 4px;text-align:left;vertical-align:top}
  th{color:#55626e;font-weight:600}
  tr.click{cursor:pointer}
  tr.click:hover{background:#f2f6fb}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:2px solid currentColor;background:#fff}
  #legend{position:fixed;right:8px;bottom:8px;background:rgba(255,255,255,.95);border:1px solid #c7d0d8;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.6}
  @media (max-width:760px){#legend{display:none} .grp button{padding:7px 8px;font-size:12.5px}}
  #err{position:fixed;inset:30% 10% auto;background:#fff;border:1px solid #c33;padding:14px;border-radius:10px;display:none}
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>

<div id="top">
  <div class="grp" id="pos">
    <button data-p="tilt" class="on">Na przyczepce</button>
    <button data-p="flat">Pozioma</button>
    <button data-p="split">Rozłożona</button>
  </div>
  <div class="ex">Rozłóż <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="grp" id="tog">
    <button data-t="xray">Prześwietl</button>
    <button data-t="mesh" class="on">Blacha</button>
    <button data-t="trailer" class="on">Przyczepka</button>
    <button data-t="labels" class="on">Opisy</button>
  </div>
  <div class="grp" id="cams">
    <button data-c="all">Całość</button>
    <button data-c="joint">Łączenie</button>
    <button data-c="leg">Podpora</button>
    <button data-c="top">Zaczep</button>
    <button data-c="tip">Dół</button>
    <button data-c="under">Spód</button>
  </div>
</div>

<div id="legend">
  <b>Otwory</b><br>
  <span style="color:#e53935"><span class="dot"></span></span>Ø10,5 (M10)<br>
  <span style="color:#1e88e5"><span class="dot"></span></span>Ø16,5 (tulejka)<br>
  <span style="color:#8e24aa"><span class="dot"></span></span>Ø17 (sworzeń M16)<br>
  <span style="color:#2e9d4a"><span class="dot"></span></span>Ø8,5 (M8)
</div>

<div id="panel">
  <div id="tabs">
    <button data-tab="part" class="on">Część</button>
    <button data-tab="holes">Wiercenia</button>
    <button data-tab="bolts">Śruby</button>
    <button data-tab="steps">Montaż</button>
    <button id="mini" title="Zwiń">▾</button>
  </div>
  <div id="pbody"></div>
</div>
<div id="err">Nie udało się wczytać biblioteki 3D (three.js). Odśwież stronę.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='block';return;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const PI=Math.PI, R3=Math.sqrt(3);

/* ---------- wymiary (mm). x = w poprzek, y = w górę, z = wzdłuż rampy (0 = koniec przy zawiasach) ---------- */
const S=300, L=2700, BEV=400;
const PIVY=64, PIVZ=-10;                      // krawędź podłogi przyczepki
const ALPHA=Math.asin(396/2710);              // ~8,4° przy podłodze 400 mm
const H=400, GROUND=64-H;
const HOLE_COL={10.5:0xe53935,16.5:0x1e88e5,17:0x8e24aa,8.5:0x2e9d4a};

/* ---------- scena ---------- */
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
view.appendChild(renderer.domElement);
const lr=new THREE.CSS2DRenderer();
lr.setSize(innerWidth,innerHeight);
document.getElementById('labels').appendChild(lr.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe9edf1);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,5,40000);
const FAR=()=>innerWidth<innerHeight?1.9:1;
camera.position.set(150+2300*FAR(),700*FAR(),1350+1500*FAR());
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(150,-150,1300);controls.enableDamping=true;controls.dampingFactor=0.12;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f96,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(1500,3000,2200);scene.add(sun);
const sun2=new THREE.DirectionalLight(0xffffff,0.35);sun2.position.set(-1500,-800,-1500);scene.add(sun2);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000),new THREE.MeshStandardMaterial({color:0xcfd4d8,roughness:1}));
ground.rotation.x=-PI/2;ground.position.set(150,GROUND-1,1300);scene.add(ground);
const grid=new THREE.GridHelper(9000,90,0xaab2ba,0xbfc6cc);grid.position.set(150,GROUND,1300);scene.add(grid);

const pivot=new THREE.Group();pivot.position.set(0,PIVY,PIVZ);scene.add(pivot);
const ramp=new THREE.Group();ramp.position.set(0,-PIVY,-PIVZ);pivot.add(ramp);
const trailer=new THREE.Group();scene.add(trailer);

/* ---------- materiały ---------- */
const std=(c,m,r)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r,side:THREE.DoubleSide});
const BASE={
  tube:std(0xb3c0cc,0.45,0.45), angle:std(0x7f8d9a,0.45,0.5), curb:std(0x5f7d8c,0.4,0.5), flat:std(0x55636f,0.45,0.5),
  ear:std(0xe67e22,0.25,0.5), insert:std(0xe67e22,0.35,0.45), bracket:std(0x2e4a62,0.4,0.5), bolt:std(0xd9b44a,0.75,0.32), nut:std(0xc39a2f,0.75,0.35),
  washer:std(0xe4e8ec,0.8,0.28), sleeve:std(0xc7743d,0.6,0.4), screw:std(0x9db4cb,0.7,0.3), wood:std(0xb08455,0,0.85),
  beam:std(0x39434d,0.4,0.6), plug:std(0x202326,0,0.8)
};
const XRAY_KEYS=['tube','angle','curb','flat','ear','bracket','beam','wood','plug'];
const mats={};
function mat(kind,key){const k=kind+'|'+key;if(!mats[k]){const m=BASE[key].clone();m.userData={kind,key};mats[k]=m;}return mats[k];}

const movables=[];
function reg(obj,parent,kind,ex){obj.userData.kind=kind;parent.add(obj);movables.push({obj,base:obj.position.clone(),ex:ex||V(0,0,0)});return obj;}

/* ---------- prymitywy ---------- */
function shapeFrom(outline,holes){
  const sh=new THREE.Shape();outline.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));
  (holes||[]).forEach(h=>{const p=new THREE.Path();p.absarc(h[0],h[1],h[2]/2,0,2*PI,true);sh.holes.push(p);});
  return sh;
}
// plane: 'xz' (pozioma, grubość w górę od off), 'zy' (pionowa, normalna x, od off-t do off), 'xy' (normalna z, od off do off+t)
function plate(parent,plane,outline,holes,t,off,kind,key,ex){
  let ol=outline, hl=holes||[];
  if(plane==='xz'){ol=outline.map(p=>[p[0],-p[1]]);hl=hl.map(h=>[h[0],-h[1],h[2]]);}
  const g=new THREE.ExtrudeGeometry(shapeFrom(ol,hl),{depth:t,bevelEnabled:false,curveSegments:22});
  const m=new THREE.Mesh(g,mat(kind,key));
  if(plane==='xz'){m.rotation.x=-PI/2;m.position.y=off;}
  else if(plane==='zy'){m.rotation.y=-PI/2;m.position.x=off;}
  else m.position.z=off;
  reg(m,parent,kind,ex);
  // kolorowe obwódki otworów (obie strony)
  (holes||[]).forEach(h=>{
    const col=HOLE_COL[h[2]]||0x000000;
    [0,t].forEach(f=>{
      const r=new THREE.Mesh(new THREE.TorusGeometry(h[2]/2+0.9,0.9,6,28),new THREE.MeshBasicMaterial({color:col}));
      if(plane==='xz'){r.rotation.x=PI/2;r.position.set(h[0],off+f,h[1]);}
      else if(plane==='zy'){r.rotation.y=PI/2;r.position.set(off-f,h[1],h[0]);}
      else r.position.set(h[0],h[1],off+f);
      r.userData.isHole=true;reg(r,parent,kind,ex.clone?ex.clone():ex);
    });
  });
  return m;
}
function box(parent,x0,x1,y0,y1,z0,z1,kind,key,ex){
  const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),mat(kind,key));
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);return reg(m,parent,kind,ex);
}
function orient(m,axis){if(axis==='x')m.rotation.z=PI/2;else if(axis==='z')m.rotation.x=PI/2;}
// cylinder along axis between a0..a1 (współrzędna osi), pozostałe współrzędne c
function cyl(parent,axis,a0,a1,c,r,seg,kind,key,ex){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,Math.abs(a1-a0),seg),mat(kind,key));orient(m,axis);
  const mid=(a0+a1)/2;m.position.set(axis==='x'?mid:c[0],axis==='y'?mid:c[1],axis==='z'?mid:c[2]);
  if(seg===6)m.rotateY(PI/6);
  return reg(m,parent,kind,ex);
}
function ring(parent,axis,a0,a1,c,ro,ri,kind,key,ex){
  const sh=new THREE.Shape();sh.absarc(0,0,ro,0,2*PI,false);const hp=new THREE.Path();hp.absarc(0,0,ri,0,2*PI,true);sh.holes.push(hp);
  const len=Math.abs(a1-a0);const g=new THREE.ExtrudeGeometry(sh,{depth:len,bevelEnabled:false,curveSegments:24});g.translate(0,0,-len/2);
  const m=new THREE.Mesh(g,mat(kind,key));
  if(axis==='x')m.rotation.y=PI/2;else if(axis==='y')m.rotation.x=PI/2;
  const mid=(a0+a1)/2;m.position.set(axis==='x'?mid:c[0],axis==='y'?mid:c[1],axis==='z'?mid:c[2]);
  return reg(m,parent,kind,ex);
}
const hex=(p,axis,a0,a1,c,AF,kind,key,ex)=>cyl(p,axis,a0,a1,c,AF/R3,6,kind,key,ex);
const labels=[];
function label(parent,text,pos,ex){
  const d=document.createElement('div');d.className='lbl';d.textContent=text;
  const o=new THREE.CSS2DObject(d);o.position.copy(pos);parent.add(o);movables.push({obj:o,base:pos.clone(),ex:ex||V(0,0,0)});labels.push(o);return o;
}

/* ================= NAJAZD 2,7 m Z 2 CZĘŚCI ================= */
const halfA=new THREE.Group(),halfB=new THREE.Group();ramp.add(halfA);ramp.add(halfB);
const RX=[20,280];
function rail(g,cx,z0,z1,bevel,top,bot,side){
  plate(g,'xz',[[cx-20,z0],[cx+20,z0],[cx+20,z1],[cx-20,z1]],top.map(h=>[cx,h[0],h[1]]),3,57,'tube','tube',V(0,0,0));
  const zb=bevel?z1-BEV:z1;
  plate(g,'xz',[[cx-20,z0],[cx+20,z0],[cx+20,zb],[cx-20,zb]],bot.map(h=>[cx,h[0],h[1]]),3,0,'tube','tube',V(0,0,0));
  const sd=bevel?[[z0,3],[zb+BEV*3/60,3],[z1-BEV*3/60,57],[z0,57]]:[[z0,3],[z1,3],[z1,57],[z0,57]];
  const sh=side.map(z=>[z,30,10.5]);
  plate(g,'zy',sd,sh,3,cx-17,'tube','tube',V(0,0,0));
  plate(g,'zy',sd,sh,3,cx+20,'tube','tube',V(0,0,0));
}
const ZA=[150,575,1000], ZH=[20,55];
RX.forEach(cx=>{
  rail(halfA,cx,0,1350,false,[...ZH,...ZA].map(z=>[z,16.5]),[...ZH,...ZA].map(z=>[z,10.5]),[1150,1250]);
  rail(halfB,cx,1350,2700,true,[[1700,16.5],[2200,16.5],[2595,8.5]],[[1700,10.5],[2200,10.5]],[1450,1550]);
  box(halfA,cx-20,cx+20,0,60,-3,0,'plug','plug',V(0,0,-60));
  // wkładka 50x30x4 (zostaje w górnej połowie)
  const ih=[1150,1250,1450,1550].map(z=>[z,30,10.5]);
  plate(halfA,'xz',[[cx-15,1050],[cx+15,1050],[cx+15,1650],[cx-15,1650]],[],4,51,'insert','insert',V(0,0,0));
  plate(halfA,'xz',[[cx-15,1050],[cx+15,1050],[cx+15,1650],[cx-15,1650]],[],4,5,'insert','insert',V(0,0,0));
  plate(halfA,'zy',[[1050,9],[1650,9],[1650,51],[1050,51]],ih,4,cx-11,'insert','insert',V(0,0,0));
  plate(halfA,'zy',[[1050,9],[1650,9],[1650,51],[1050,51]],ih,4,cx+15,'insert','insert',V(0,0,0));
});
// poprzeczki 40x40x4
function cross(g,zc,extra){
  const ex=V(0,-130,0);
  plate(g,'xz',[[0,zc-20],[300,zc-20],[300,zc+20],[0,zc+20]],RX.map(x=>[x,zc,10.5]),4,-4,'cross','angle',ex);
  plate(g,'xy',[[0,-40],[300,-40],[300,-4],[0,-4]],extra||[],4,zc+16,'cross','angle',ex);
}
cross(halfA,150,[[150,-22,10.5]]);cross(halfA,575);cross(halfA,1000);cross(halfB,2200);
// belka podpory 60x60x6 + nóżki M16
(function(){const ex=V(0,-130,0),zc=1700;
  plate(halfB,'xz',[[0,zc-30],[300,zc-30],[300,zc+30],[0,zc+30]],[...RX.map(x=>[x,zc,10.5]),[80,zc,17],[220,zc,17]],6,-6,'leg','angle',ex);
  plate(halfB,'xy',[[0,-60],[300,-60],[300,-6],[0,-6]],[],6,zc+24,'leg','angle',ex);
  [80,220].forEach(x=>{const e2=V(0,-230,0);
    cyl(halfB,'y',-86,35,[x,0,zc],8,16,'leg','bolt',e2);
    hex(halfB,'y',0,13,[x,0,zc],24,'leg','nut',e2);hex(halfB,'y',-19,-6,[x,0,zc],24,'leg','nut',e2);hex(halfB,'y',-80,-67,[x,0,zc],24,'leg','nut',e2);
    plate(halfB,'xz',[[x-40,zc-40],[x+40,zc-40],[x+40,zc+40],[x-40,zc+40]],[[x,zc,17]],6,-86,'leg','flat',e2);
  });})();
// blacha (2 kawałki)
const meshObjs=[];
(function(){
  const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');g.strokeStyle='#fff';g.lineWidth=15;
  for(const dx of [-256,0,256])for(const dy of [-128,0,128]){g.beginPath();g.moveTo(dx,dy+64);g.lineTo(dx+128,dy);g.lineTo(dx+256,dy+64);g.lineTo(dx+128,dy+128);g.closePath();g.stroke();}
  [[halfA,0],[halfB,1350]].forEach(([grp,z0])=>{
    const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(300/62,1350/25);tex.anisotropy=8;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(300,1350),new THREE.MeshStandardMaterial({color:0x8d9aa6,metalness:0.6,roughness:0.4,alphaMap:tex,alphaTest:0.5,side:THREE.DoubleSide}));
    m.material.userData={kind:'mesh',key:'mesh'};mats['mesh|mesh'+z0]=m.material;
    m.rotation.x=-PI/2;m.position.set(150,62,z0+675);reg(m,grp,'mesh',V(0,190,0));
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(300,3.6,1350)),new THREE.LineBasicMaterial({color:0x5b6670}));
    e.position.set(150,62,z0+675);reg(e,grp,'mesh',V(0,190,0));meshObjs.push(m,e);
  });})();
window.__meshObjs=meshObjs;
// krawężniki 30x30x3
[[halfA,90,1340,ZA],[halfB,1360,2570,[1700,2200]]].forEach(([g,z0,z1,zs])=>{
  [[0,20,3],[270,280,300]].forEach(([x0,bx,vx])=>{
    plate(g,'xz',[[x0,z0],[x0+30,z0],[x0+30,z1],[x0,z1]],zs.map(z=>[bx,z,10.5]),3,64,'curb','curb',V(0,290,0));
    plate(g,'zy',[[z0,67],[z1,67],[z1,94],[z0,94]],[],3,vx,'curb','curb',V(0,290,0));
  });});
// zaczep 150x8 i listwa dolna 120x6
plate(halfA,'xz',[[0,-70],[300,-70],[300,80],[0,80]],RX.flatMap(x=>ZH.map(z=>[x,z,10.5])),8,64,'hook','flat',V(0,290,0));
plate(halfB,'xz',[[0,2580],[300,2580],[300,2700],[0,2700]],RX.map(x=>[x,2595,8.5]),6,64,'tip','flat',V(0,290,0));
// śruby pionowe M10 + tulejki
function vbolt(g,x,z,top,botFl,kind){const up=V(0,420,0),dn=V(0,-230,0);
  ring(g,'y',3,60,[x,0,z],8,6,'sleeve','sleeve',V(0,110,0));
  if(kind==='boltH'){ring(g,'y',top,top+2,[x,0,z],10,5.3,kind,'washer',up);hex(g,'y',top+2,top+8.4,[x,0,z],17,kind,'bolt',up);cyl(g,'y',-14,top+2,[x,0,z],5,16,kind,'bolt',up);
    ring(g,'y',-2,0,[x,0,z],10,5.3,kind,'washer',dn);hex(g,'y',-12,-2,[x,0,z],17,kind,'nut',dn);return;}
  ring(g,'y',top,top+2.5,[x,0,z],15,5.5,kind,'washer',up);hex(g,'y',top+2.5,top+8.9,[x,0,z],17,kind,'bolt',up);
  cyl(g,'y',-botFl-16-4,top+2.5,[x,0,z],5,16,kind,'bolt',up);
  ring(g,'y',-botFl-2,-botFl,[x,0,z],10,5.3,kind,'washer',dn);hex(g,'y',-botFl-12,-botFl-2,[x,0,z],17,kind,'nut',dn);}
RX.forEach(x=>{ZH.forEach(z=>vbolt(halfA,x,z,72,0,'boltH'));ZA.forEach(z=>vbolt(halfA,x,z,67,4,'boltX'));vbolt(halfB,x,2200,67,4,'boltX');vbolt(halfB,x,1700,67,6,'boltX');});
// wkręty krawężników
[[halfA,[300,450,800,900]],[halfB,[1900,2050,2350,2500]]].forEach(([g,zs])=>[15,285].forEach(x=>zs.forEach(z=>{const ex=V(0,420,0);
  hex(g,'y',67,72.5,[x,0,z],8,'screw','screw',ex);cyl(g,'y',29,67,[x,0,z],2.75,10,'screw','screw',ex);})));
// listwa: M8x25

function select(kind,switchTab){
  selected=kind;

}

const ray=new THREE.Raycaster();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  const r=renderer.domElement.getBoundingClientRect();
  ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},camera);
  const hits=ray.intersectObjects(movables.map(m=>m.obj).filter(o=>o.isMesh&&o.visible&&isVisible(o)),false).filter(h=>h.object.userData.kind);
  if(!hits.length){select(null);return;}
  let pick=hits[0];
  if(pick.object.userData.kind==='mesh'){const nxt=hits.find(h=>h.object.userData.kind!=='mesh');if(nxt&&nxt.distance-pick.distance<25)pick=nxt;}
  select(pick.object.userData.kind);
});
function isVisible(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);lr.setSize(innerWidth,innerHeight);});

let last=performance.now();
function loop(now){
  const rdt=Math.min(0.25,(now-last)/1000),dt=Math.min(0.05,rdt);last=now;
  ang+=(angTarget-ang)*Math.min(1,rdt*5);pivot.rotation.x=ang;
  split+=(splitT-split)*Math.min(1,rdt*4);halfB.position.z=450*split;
  strap.visible=Math.abs(ang-ALPHA)<0.01&&split<0.01;
  const e=ex*ex*(3-2*ex);
  movables.forEach(m=>{m.obj.position.copy(m.base).addScaledVector(m.ex,e);});
  if(camAnim){camAnim.t=Math.min(1,camAnim.t+rdt*1.6);const k=camAnim.t*camAnim.t*(3-2*camAnim.t);
    camera.position.lerpVectors(camAnim.p0,camAnim.p1,k);controls.target.lerpVectors(camAnim.t0,camAnim.t1,k);if(camAnim.t>=1)camAnim=null;}
  controls.update();renderer.render(scene,camera);lr.render(scene,camera);
  requestAnimationFrame(loop);
}
