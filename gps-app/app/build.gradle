plugins {
    id "com.android.application"
}

android {
    namespace "pl.gps.pozycja"
    compileSdk 36

    defaultConfig {
        applicationId "pl.gps.pozycja"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
