plugins {
    id "com.android.application"
}

android {
    namespace "pl.gps.pozycja"
    compileSdk 36

    defaultConfig {
        applicationId "pl.gps.pozycja"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Rozpoznawanie aktywności (wykrywanie jazdy autem) z usług Google Play
    implementation "com.google.android.gms:play-services-location:21.4.0"
    testImplementation "junit:junit:4.13.2"
}
