plugins {
    id "com.android.application"
}

// ---------------------------------------------------------------- podpis wersji release
// Dane klucza NIGDY nie trafiają do repozytorium. Źródła (pierwsze znalezione wygrywa):
//  1. zmienne środowiskowe SIGNING_STORE_FILE, SIGNING_STORE_PASSWORD,
//     SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD (tak robi GitHub Actions),
//  2. plik keystore.properties w katalogu gps-app (lokalnie, jest w .gitignore).
// Bez nich wersja release buduje się niepodpisana, a debug działa jak zawsze.
def signingProps = new Properties()
def signingFile = rootProject.file("keystore.properties")
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def signingValue = { String env, String prop ->
    def v = System.getenv(env)
    return (v != null && !v.isEmpty()) ? v : signingProps.getProperty(prop)
}
def releaseStoreFile = signingValue("SIGNING_STORE_FILE", "storeFile")
def hasReleaseSigning = releaseStoreFile != null && file(releaseStoreFile).exists()

android {
    namespace "pl.gps.pozycja"
    compileSdk 36

    defaultConfig {
        applicationId "pl.gps.pozycja"
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName "1.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue("SIGNING_STORE_PASSWORD", "storePassword")
                keyAlias signingValue("SIGNING_KEY_ALIAS", "keyAlias")
                keyPassword signingValue("SIGNING_KEY_PASSWORD", "keyPassword")
            }
        }
    }

    buildTypes {
        release {
            // R8: usuwa nieużywany kod bibliotek, APK jest kilka razy mniejszy.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
}
