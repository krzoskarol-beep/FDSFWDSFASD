# Dwa kontenery z tego samego obrazu:
#  - scraper: skanuje w pętli i zapisuje cookies + wynik do volume'u danych,
#  - api: Flask (gunicorn) zwraca ostatni skan pod http://localhost:5000/scan/latest
services:
  scraper:
    build: .
    image: allegro-scraper:latest
    command: ["python", "-m", "scraper.runner", "--loop"]
    environment:
      QUERIES: "karta graficzna rtx 4070,słuchawki sony wh-1000xm5"
      SCAN_INTERVAL: "3600"      # co godzinę (±10%)
      MIN_DELAY: "2"
      MAX_DELAY: "8"
      BLOCK_WAIT_MIN: "30"
      BLOCK_WAIT_MAX: "90"
      MAX_RETRIES: "3"
      SHUFFLE_HEADERS: "1"
      TZ: "Europe/Warsaw"
    volumes:
      - scraper-data:/data       # cookies.json i last_scan.json przetrwają restart
      - scraper-logs:/logs       # scraper.log (rotowany)
    restart: unless-stopped

  api:
    build: .
    image: allegro-scraper:latest
    command:
      - gunicorn
      - --bind=0.0.0.0:5000
      - --workers=2
      - --access-logfile=/logs/api-access.log
      - --error-logfile=/logs/api-error.log
      - scraper.api:app
    environment:
      TZ: "Europe/Warsaw"
    ports:
      - "5000:5000"
    volumes:
      - scraper-data:/data:ro    # API tylko czyta wynik
      - scraper-logs:/logs
    depends_on:
      - scraper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  scraper-data:
  scraper-logs:
