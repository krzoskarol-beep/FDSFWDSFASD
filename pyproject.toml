[project]
name = "allegro-ceny"
version = "0.1.0"
description = "Zbieranie i porównywanie cen ofert Allegro (Playwright + SQLite)"
requires-python = ">=3.11"
dependencies = ["playwright==1.63.0", "beautifulsoup4==4.14.2"]

[tool.pytest.ini_options]
