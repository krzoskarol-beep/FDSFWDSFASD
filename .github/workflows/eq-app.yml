# Buduje i testuje aplikację Android „Korektor” (katalog eq-app/).
#
# Podpisana wersja release powstaje tylko wtedy, gdy w repozytorium są ustawione sekrety
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   – plik .jks zakodowany w base64
#   ANDROID_KEYSTORE_PASSWORD – hasło do pliku
#   ANDROID_KEY_ALIAS         – alias klucza
#   ANDROID_KEY_PASSWORD      – hasło klucza
name: Android – Korektor

on:
  push:
    paths:
      - "eq-app/**"
      - ".github/workflows/eq-app.yml"
  pull_request:
    paths:
      - "eq-app/**"
      - ".github/workflows/eq-app.yml"
  workflow_dispatch:

concurrency:
  group: eq-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: eq-app

jobs:
  build:
    name: Testy, lint i APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Testy jednostkowe, lint, APK debug
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Klucz podpisu z sekretów
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: APK release (podpisany)
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -2

      - name: Usuń klucz
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: APK release (do instalacji)
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Korektor-release
          path: eq-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: APK debug (do testów)
        uses: actions/upload-artifact@v7
        with:
          name: Korektor-debug
          path: eq-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Raporty testów i lintu
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raporty-build-eq
          path: |
            eq-app/app/build/reports/
            eq-app/app/build/test-results/
          if-no-files-found: ignore

  emulator:
    name: Testy na emulatorze (Android 14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Włącz KVM (przyspieszenie emulatora)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Zbuduj aplikację i testy
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Uruchom testy na emulatorze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: eq-app
          script: ./gradlew connectedDebugAndroidTest

      - name: Raporty z emulatora
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raporty-emulator-eq
          path: |
            eq-app/app/build/reports/androidTests/
            eq-app/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
