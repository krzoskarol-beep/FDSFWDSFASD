# Publikuje wersję webową (iPhone) na GitHub Pages:
#   https://krzoskarol-beep.github.io/FDSFWDSFASD/
# Jednorazowo: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
# Działa z gałęzi domyślnej (po scaleniu PR) albo ręcznie (Actions → Run workflow).
name: Strona – Godziny Pracy (iPhone)

on:
  push:
    paths:
      - "hours-web/**"
      - ".github/workflows/hours-web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publikacja
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Pliki aplikacji (bez testów)
        run: |
          mkdir _site
          cp -r hours-web/index.html hours-web/app.css hours-web/app.js hours-web/core.js \
                hours-web/sw.js hours-web/manifest.webmanifest hours-web/icons _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
