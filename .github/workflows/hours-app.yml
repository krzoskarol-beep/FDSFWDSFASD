# Buduje i testuje aplikację Android „Godziny Pracy” (katalog hours-app/).
#
# Podpisana wersja release powstaje tylko wtedy, gdy w repozytorium są ustawione sekrety
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   – plik .jks zakodowany w base64
#   ANDROID_KEYSTORE_PASSWORD – hasło do pliku
#   ANDROID_KEY_ALIAS         – alias klucza
#   ANDROID_KEY_PASSWORD      – hasło klucza
name: Android – Godziny Pracy

on:
  push:
    paths:
      - "hours-app/**"
      - "hours-web/test/fixtures/**"
      - ".github/workflows/hours-app.yml"
  pull_request:
    paths:
      - "hours-app/**"
      - "hours-web/test/fixtures/**"
      - ".github/workflows/hours-app.yml"
  workflow_dispatch:

concurrency:
  group: hours-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: hours-app

jobs:
  build:
    name: Testy, lint i APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Testy jednostkowe, lint, APK debug
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      # Dowód niezależny od kodu aplikacji: skrypt w Pythonie (Decimal) przelicza eksport CSV
      # próbki 12 tygodni wg FLSA i porównuje z sumami aplikacji co do minuty i centa.
      - name: Niezależne przeliczenie wypłaty (Python vs aplikacja)
        run: python3 tools/sprawdz_csv.py app/build/weryfikacja/probka.csv --porownaj app/build/weryfikacja/oczekiwane.txt

      # Wersja webowa (iPhone) jest testowana na tych samych danych: pliki muszą być aktualne.
      - name: Zgodność z wersją webową (pliki testów)
        run: |
          for f in probka.csv oczekiwane.txt raport-tydzien.txt raport-miesiac.txt; do
            diff -u "app/build/weryfikacja/$f" "../hours-web/test/fixtures/$f"
          done

      - name: Klucz podpisu z sekretów
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: APK release (podpisany)
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -2

      - name: Usuń klucz
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: APK release (do instalacji)
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: GodzinyPracy-release
          path: hours-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: APK debug (do testów)
        uses: actions/upload-artifact@v7
        with:
          name: GodzinyPracy-debug
          path: hours-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Raporty testów i lintu
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raporty-build-hours
          path: |
            hours-app/app/build/reports/
            hours-app/app/build/test-results/
            hours-app/app/build/weryfikacja/
          if-no-files-found: ignore

  emulator:
    name: Testy na emulatorze (Android 14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Włącz KVM (przyspieszenie emulatora)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Zbuduj aplikację i testy
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Uruchom testy na emulatorze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: hours-app
          script: ./gradlew connectedDebugAndroidTest

      - name: Raporty z emulatora
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raporty-emulator-hours
          path: |
            hours-app/app/build/reports/androidTests/
            hours-app/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
