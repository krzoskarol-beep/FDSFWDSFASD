# Wydanie nowej wersji aplikacji „Moja pozycja GPS”.
#
# Uruchamiane ręcznie: Actions → „Android – wydanie wersji” → Run workflow.
# Buduje podpisany APK (wymaga sekretów klucza, patrz gps-app.yml) i publikuje go
# w GitHub Releases. Najnowsza wersja jest zawsze pod stałym linkiem:
#   https://github.com/<właściciel>/<repo>/releases/latest/download/MojaPozycjaGPS.apk
name: Android – wydanie wersji

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: gps-app

jobs:
  release:
    name: Podpisany APK → GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Sprawdź sekrety klucza
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu ANDROID_KEYSTORE_BASE64. Instrukcja: gps-app/README.md, sekcja CI."
            exit 1
          fi

      - name: Wersja z build.gradle
        id: version
        run: |
          VERSION=$(grep -oE 'versionName "[^"]+"' app/build.gradle | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Wersja: $VERSION"
          # Opis wydania: sekcja tej wersji z CHANGELOG.md
          awk -v v="## $VERSION" '$0 ~ "^## " {p = (index($0, v) == 1)} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Wersja $VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Testy jednostkowe
        run: ./gradlew testDebugUnitTest

      - name: Klucz podpisu z sekretów
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Zbuduj podpisany APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -2
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/MojaPozycjaGPS.apk"
          cp "$APK" "$RUNNER_TEMP/out/MojaPozycjaGPS-${{ steps.version.outputs.version }}.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Usuń klucz
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Opublikuj w GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: gps-v${{ steps.version.outputs.version }}
          name: Moja pozycja GPS ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: true
          files: |
            ${{ runner.temp }}/out/MojaPozycjaGPS.apk
            ${{ runner.temp }}/out/MojaPozycjaGPS-${{ steps.version.outputs.version }}.apk
            ${{ runner.temp }}/out/SHA256SUMS.txt
